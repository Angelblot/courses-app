<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <h1>Courses</h1>
      <span id="site-label" class="site"></span>
    </header>

    <section id="compte" class="panel compte">
      <div id="compte-connecte" hidden>
        <span id="compte-email" class="hint"></span>
        <button id="deconnexion" class="lien">Se déconnecter</button>
      </div>
      <div id="compte-formulaire">
        <p class="hint">Connecte-toi pour relever les listes envoyées depuis l'application.</p>
        <label class="field">
          <span>Adresse e-mail</span>
          <input id="email" type="email" autocomplete="username" />
        </label>
        <label class="field">
          <span>Mot de passe</span>
          <input id="mdp" type="password" autocomplete="current-password" />
        </label>
        <p id="compte-erreur" class="erreur" hidden></p>
        <button id="connexion" class="btn">Se connecter</button>
      </div>
    </section>

    <section id="travaux" class="panel" hidden>
      <p id="travaux-resume" class="hint"></p>
      <button id="remplir" class="btn">Remplir le panier</button>
    </section>

    <section id="idle" class="panel">
      <p class="hint">
        Saisie manuelle — elle reste disponible même sans connexion, et
        c'est le seul recours si Supabase est injoignable.
      </p>
      <label class="field">
        <span>Enseigne</span>
        <select id="site">
          <option value="carrefour">Carrefour</option>
          <option value="leclerc">E.Leclerc Drive</option>
        </select>
        <span id="site-hint" class="hint hint--inline"></span>
      </label>
      <label class="field">
        <span>Liste — un produit ou une URL de fiche par ligne, quantité optionnelle après « x »</span>
        <textarea id="items" rows="7" placeholder="Spaghetti 500g x2&#10;Lardons fumés&#10;https://www.carrefour.fr/p/…-3443660013046 x2"></textarea>
      </label>
      <button id="start" class="btn">Remplir le panier</button>
      <button id="diagnose" class="btn btn--ghost">Diagnostiquer cette page</button>
    </section>

    <section id="running" class="panel" hidden>
      <div class="progress">
        <div id="bar" class="progress__bar"></div>
      </div>
      <p id="progress-text" class="hint"></p>
      <ul id="log" class="log"></ul>
      <div class="row">
        <button id="resume" class="btn" hidden>Reprendre</button>
        <button id="stop" class="btn btn--ghost">Arrêter</button>
      </div>
    </section>

    <pre id="diag" class="diag" hidden></pre>

    <script type="module" src="popup.js"></script>
  </body>
</html>
